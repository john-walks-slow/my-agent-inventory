    items:
      - id: mcp-degoog
        name: degoog
        title: Degoog 隐私聚合元搜索引擎
        icon: search
        rarity: legendary
        category: search
        description: 本地私有化部署的多源搜索聚合 MCP 服务器，一键汇总 Google、DuckDuckGo 与 Brave 结果。
        version: 2.4.0
        author: Degoog Community / Modded by John
        config: |-
          // dsh mcp 配置
          {
            "mcpServers": {
              "degoog": {
                "command": "node",
                "args": ["/home/<you>/mcp/degoog-mcp/dist/index.js"],
                "env": { "DEGOOG_URL": "http://127.0.0.1:8080" }
              }
            }
          }
        highlights:
          - 多引擎并发融合
          - 本地免费调用
          - 支持一键 Markdown Scrape
        tags:
          - Search
          - Privacy
          - Aggregator
          - High-Speed
        added: 2026-06-20
      - id: mcp-exa
        name: exa
        title: Exa 语义神经搜索与网页阅读
        icon: compass
        rarity: epic
        category: research
        description: 基于 Embedding 语义匹配的新一代 AI 原生搜索引擎，搜技术博客和论文的利器。
        version: 1.2.0
        author: Exa AI
        config: |-
          // dsh mcp 配置（多 Key 轮询版）
          {
            "mcpServers": {
              "exa": {
                "command": "npx",
                "args": ["-y", "exa-multi-mcp"],
                "type": "stdio",
                "env": { "EXA_API_KEYS": "<your-api-key>,<your-api-key-2>" }
              }
            }
          }
        highlights:
          - 语义联想超强
          - 直接返回干净正文
          - 支持企业与人员维度过滤
        tags:
          - Neural Search
          - Semantic
          - Markdown Extraction
        added: 2026-07-15
      - id: mcp-notebooklm
        name: notebooklm
        title: Google NotebookLM 知识库桥接
        icon: book-marked
        rarity: epic
        category: research
        description: 连接 Google NotebookLM 专属笔记本，进行高质量长文档研读与播客式总结。

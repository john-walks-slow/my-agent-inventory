      - id: dsh-wait-subagent
        name: dsh-wait-subagent
        title: 子代理收敛同步器
        icon: hourglass
        rarity: legendary
        category: tools
        description: 阻塞等待指定后台子代理（continuable subagent）执行完毕并提取其终结输出。
        version: 1.0.0
        author: John Ren
        repo: https://github.com/johnren/dsh-wait-subagent
        install: |-
          dsh plugin install dsh-wait-subagent
          # 或本地链接开发:
          cd ~/plugins/dsh-wait-subagent && pnpm link --global
        config: |-
          // cordis.yml 注入配置
          plugins:
            dsh-wait-subagent:
              timeout_ms: 180000 # 默认超时 3 分钟
        highlights:
          - 告别愚蠢轮询
          - 支持毫秒超时保护
          - 精准提取 closing message
          - 多 Agent 流水线基石
        tags:
          - Subagent
          - Async
          - Workflow
          - Must-Have
        added: 2026-08-12
      - id: dsh-clear-mind
        name: dsh-clear-mind
        title: 思维蒸馏与上下文收敛
        icon: sparkles
        rarity: legendary
        category: core
        description: Agent 自主上下文剪枝与压缩检查点工具，把长会话蒸馏成精简快照。
        stack: 99
        version: 2.1.0
        author: John Ren
        repo: https://github.com/johnren/dsh-clear-mind
        install: dsh plugin install dsh-clear-mind
        config: |-
          clear_mind:
            auto_threshold_steps: 50
            default_compaction: minimal
        highlights:
          - Agent 自主压缩
          - 保留结构化检查点
          - 降低 70% Token 消耗
          - 杜绝注意力涣散

      - id: dsh-proactive
        name: dsh-proactive
        title: 宿主级主动闹钟与心跳唤醒
        icon: alarm-clock
        rarity: legendary
        category: core
        description: 提供精准 Cron 定时器、延时唤醒与静默免打扰机制，赋予 Agent 真正的时间自主意识。
        version: 1.4.2
        author: John Ren
        repo: https://github.com/johnren/dsh-proactive
        install: dsh plugin install dsh-proactive
        config: |-
          proactive:
            enabled: true
            max_deliveries_per_day: 30
            quiet_hours:
              start: "23:00"
              end: "08:00"
              time_zone: "Asia/Shanghai"
        highlights:
          - 自主定时调度
          - 静默唤醒与免打扰
          - Cron 与相对延时
          - 与 IM 无缝桥接
        tags:

name: CI

on:
  push:
    branches-ignore: ["main", "master"] # main/master 走 deploy.yml（内含同套质检）
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Validate config
        run: pnpm validate
      - name: Privacy scan
        run: pnpm privacy:scan
      - name: Build
        run: pnpm build
